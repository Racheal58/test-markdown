name: Update Documentation
on:
  pull_request:
    branches:
      - master
jobs:
  update-doc:
    name: Update Theneo Documentation
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Update Documentation on Theneo
        run: |
          npm install -g @theneo/cli@latest
          theneo login --token e41cc714-a947-4b20-b09f-62975cb139a6
          ls -al
          theneo project list
          theneo project import --project test-markdown --workspace racheal-test-theneo --projectVersion v1 --publish --file doc/api.yml --import-type overwrite
